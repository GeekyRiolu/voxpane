# voxpane in Docker — the Whisper STT + Piper TTS engine, with your host's
# microphone and speaker passed through. This runs the resident STT daemon (and
# `speak`, `transcribe`, `doctor` on demand).
#
# The full hands-free DESKTOP experience — the eww pet, wake-word-opens-a-terminal,
# Claude Code hooks — needs the host compositor and the `claude` CLI, so for that
# use the native install (`uv tool install`). See docs/DOCKER.md.
#
# Assumes your user is UID 1000 (check with `id -u`) and PipeWire on the host.

services:
  voxpane:
    image: ghcr.io/geekyriolu/voxpane:latest
    # build: .                       # ...or build locally instead of pulling
    container_name: voxpane
    command: ["daemon"]              # resident faster-whisper model behind a socket
    user: "1000:1000"               # MUST match your host UID:GID for socket access
    group_add:
      - audio
    environment:
      # voxpane keeps its own runtime files in /run/voxpane; PipeWire's socket is
      # mounted there too, and PulseAudio is the fallback.
      PULSE_SERVER: unix:/run/voxpane/pulse/native
    devices:
      - /dev/snd:/dev/snd            # ALSA fallback
    volumes:
      # mic + speaker (PipeWire native — primary path for pw-cat/pw-record/pw-play)
      - ${XDG_RUNTIME_DIR}/pipewire-0:/run/voxpane/pipewire-0
      # PulseAudio socket (fallback + sink control via pactl/paplay/parec)
      - ${XDG_RUNTIME_DIR}/pulse/native:/run/voxpane/pulse/native
      # STT/TTS models download here once, then persist (keeps the image slim)
      - voxpane-models:/models
      # optional: reuse your host config (wake_word, sink, backends, …)
      - ${HOME}/.config/voxpane:/config/voxpane
    restart: unless-stopped

volumes:
  voxpane-models:
