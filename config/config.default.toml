# voxpane — default configuration.
#
# This is the canonical default. `install.sh` copies it to
# ~/.config/voxpane/config.toml, where you edit it. A user config only needs the
# keys it wants to override; everything else falls back to the values here.

[audio]
source = "default"             # mic node; set to a PipeWire echo-cancel source to
                               # strip speaker audio from the mic (docs/INSTALL.md §6)
rate = 16000
max_seconds = 120

[whisper]
binary = "whisper-cli"
model = "~/.local/share/whisper-models/ggml-large-v3-turbo-q5_0.bin"
daemon_model = "large-v3-turbo"   # faster-whisper model used by `voxpane daemon` (M5)
language = "en"
threads = 0
# Biases the decoder toward your vocabulary. Caps at 224 tokens — voxpane warns
# past that. `voxpane vocab --from-repo` can extend this per project.
initial_prompt = """
Claude Code, tmux, Hyprland, Omarchy, Arch Linux, Wayland, Neovim, git rebase,
async await, TypeScript, Python, JSON, YAML, npm, uv, Docker, Postgres, API,
refactor, stdout, stderr, CLI, repo, commit, branch, merge conflict.
"""

[delivery]
mode = "tmux"                  # tmux | focus | clipboard
tmux_target = "claude:0.0"
auto_submit = false            # never true by default — you press Enter
focus_paste_delay_ms = 80      # focus mode: wait before the paste chord

[behavior]
strip_filler = true
trailing_submit_phrase = "send it"   # say this to submit that one utterance

[listen]
# Hands-free conversation mode: a continuous VAD loop, auto-started per Claude
# session (SessionStart/End hooks). No push-to-talk. Needs the `listen` extra:
#   uv tool install --force 'voxpane[daemon,listen]'
enabled = true
endpoint_silence_ms = 1500      # auto-submit after this much trailing silence
min_speech_ms = 300             # ignore blips shorter than this (coughs, clicks)
max_utterance_seconds = 30      # hard cap on a single utterance
vad_aggressiveness = 2          # webrtcvad 0..3 — higher filters more non-speech
auto_submit = true              # press Enter after delivering (hands-free)
conversational = true           # speak Claude's response, and relax the gate
post_speak_guard_ms = 700       # ignore the mic this long after the Dot speaks
barge_in = false                # EXPERIMENTAL: your speech interrupts the Dot
                                # (unreliable without mic/speaker separation)
stop_words = ["stop", "stop it", "enough", "cancel", "never mind"]
# Only listen while the Claude Code terminal is focused (Hyprland). The window is
# captured when the session starts; switch to a browser/other app and the mic is
# ignored — so it won't transcribe YouTube, calls, or someone else talking.
focus_only = true
focus_poll_ms = 250             # how often to check the focused window
focus_match = ""                # optional class/title regex override (empty = the
                                # exact window Claude started in)
pause_on_playback = true        # pause the mic while other apps play audio, so it
                                # never transcribes a video/song — pause it to talk.
                                # For talking OVER audio, use an echo-cancel source
                                # (audio.source) instead; see docs/INSTALL.md §6.

[speak]
enabled = true
backends = ["alexa", "bluetooth", "notify"]   # tried in order
max_chars = 240
prefix_project = "auto"        # auto | always | never

[speak.gate]
min_turn_seconds = 25          # short turns stay silent
require_tool_use = true        # must have edited/run something
skip_if_question = true        # suppress when the turn ends in a question
quiet_hours = "23:00-08:00"

[speak.alexa]
command = "alexa"
device = "Office Dot"
mode = "say"                   # say (no chime) | announce (chime)

[speak.bluetooth]
sink = ""                      # empty = autodetect bluez_output.*
piper_model = "~/.local/share/piper/en_GB-alba-medium.onnx"
lead_silence_ms = 800

[summary]
mode = "hybrid"                # facts | llm | hybrid
llm_command = "claude -p --model haiku --output-format text"
llm_timeout_seconds = 8
