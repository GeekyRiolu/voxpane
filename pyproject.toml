[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxpane"
version = "0.3.0"
description = "Talk to Claude Code, and have your Echo Dot tell you what it did."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Rishabh Sharma" }]
keywords = [
    "claude-code", "whisper", "speech-to-text", "tts", "voice-assistant",
    "wayland", "hyprland", "tmux", "alexa", "push-to-talk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
# Core is stdlib-only (tomllib ships with Python >= 3.11). Heavy pieces are extras.
dependencies = []

[project.optional-dependencies]
daemon = ["faster-whisper>=1.0"]        # M5: resident STT model
listen = ["webrtcvad-wheels>=2.0"]      # hands-free VAD listen mode
windows = ["sounddevice>=0.4; sys_platform == 'win32'"]  # WASAPI mic capture (Phase 2)
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]

[project.scripts]
voxpane = "voxpane.cli:main"

[project.urls]
Homepage = "https://github.com/GeekyRiolu/voxpane"
Repository = "https://github.com/GeekyRiolu/voxpane"
Issues = "https://github.com/GeekyRiolu/voxpane/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voxpane"]

# Ship the config defaults inside the wheel so config.py can find them after a
# plain `pip install` (config.py looks under <package>/data/).
[tool.hatch.build.targets.wheel.force-include]
"config/config.default.toml" = "voxpane/data/config.default.toml"
"config/commands.default.toml" = "voxpane/data/commands.default.toml"
"hooks/voxpane-post-tool.sh" = "voxpane/data/hooks/voxpane-post-tool.sh"
"hooks/voxpane-stop.sh" = "voxpane/data/hooks/voxpane-stop.sh"
"hooks/voxpane-notification.sh" = "voxpane/data/hooks/voxpane-notification.sh"
"hooks/voxpane-session-start.sh" = "voxpane/data/hooks/voxpane-session-start.sh"
"hooks/voxpane-session-end.sh" = "voxpane/data/hooks/voxpane-session-end.sh"
"hooks/voxpane-post-tool.ps1" = "voxpane/data/hooks/voxpane-post-tool.ps1"
"hooks/voxpane-stop.ps1" = "voxpane/data/hooks/voxpane-stop.ps1"
"hooks/voxpane-notification.ps1" = "voxpane/data/hooks/voxpane-notification.ps1"
"hooks/voxpane-session-start.ps1" = "voxpane/data/hooks/voxpane-session-start.ps1"
"hooks/voxpane-session-end.ps1" = "voxpane/data/hooks/voxpane-session-end.ps1"
"ui/eww/eww.yuck" = "voxpane/data/ui/eww/eww.yuck"
"ui/eww/eww.scss" = "voxpane/data/ui/eww/eww.scss"
"ui/eww/pet/idle.svg" = "voxpane/data/ui/eww/pet/idle.svg"
"ui/eww/pet/listening.svg" = "voxpane/data/ui/eww/pet/listening.svg"
"ui/eww/pet/thinking.svg" = "voxpane/data/ui/eww/pet/thinking.svg"
"ui/eww/pet/speaking.svg" = "voxpane/data/ui/eww/pet/speaking.svg"
"ui/eww/pet/idle.png" = "voxpane/data/ui/eww/pet/idle.png"
"ui/eww/pet/listening.png" = "voxpane/data/ui/eww/pet/listening.png"
"ui/eww/pet/thinking.png" = "voxpane/data/ui/eww/pet/thinking.png"
"ui/eww/pet/speaking.png" = "voxpane/data/ui/eww/pet/speaking.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
